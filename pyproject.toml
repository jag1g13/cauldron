[project]
name = "cauldron"
version = "0.1.0"
description = "Developer-friendly containerised development environments with rootless Podman."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "click>=8.4.2",
]

[project.scripts]
cauldron = "cauldron.__main__:main"

[build-system]
requires = ["uv_build>=0.11.28,<0.12"]
build-backend = "uv_build"

[tool.hatch.build.targets.wheel]
packages = ["src/cauldron"]

[tool.hatch.build.targets.wheel.package-data]
cauldron = ["data/*"]

[dependency-groups]
dev = [
    "prek>=0.4.9",
    "pytest>=9.1.1",
    "ruff>=0.15.21",
]

[tool.pytest.ini_options]
# Keep test directories inside the project so they are visible to the host
# Podman when tests run inside a cauldron using the static remote client.
addopts = "--basetemp=tmp/pytest -m 'not slow'"
markers = [
    "integration: requires a reachable Podman service",
    "slow: long-running tests, such as downloading a static Podman client",
]
