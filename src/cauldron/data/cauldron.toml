# Cauldron project configuration.
#
# Use the [container] table to customise the container image, mounts, ports,
# and known-hosts entries.
# Use the [env] table to set environment variables inside the container.
# PATH values may use ${PATH} as a placeholder for the image's default PATH.
# Use the [scripts] table to inject scripts that run at container lifecycle
# points: post_create, post_start, and entrypoint.
#
# Host environment variables (e.g. $HOME, $SSH_AUTH_SOCK) are expanded in
# mount paths, env values, and script file paths, so you can reference host
# paths without hard-coding them.
#
# The example mounts below pass through your Git configuration and SSH agent
# socket. Uncomment them to enable passthrough.

