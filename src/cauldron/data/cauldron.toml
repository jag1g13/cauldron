# Cauldron project configuration.
#
# Use the [container] table to customise the container image, mounts, ports,
# and known-hosts entries.
# Use the [env] table to set environment variables inside the container.
# PATH values may use ${PATH} as a placeholder for the image's default PATH.
# Use the [scripts] table to inject Bash scripts that run at container
# lifecycle points: post_build, post_start, and entrypoint.
#
# Host environment variables (e.g. $HOME, $SSH_AUTH_SOCK) are expanded in
# mount paths and env values, so you can reference host paths without
# hard-coding them. Script names refer to files in .cauldron or the global
# Cauldron config directory.
#
# The example mounts below pass through your Git configuration and SSH agent
# socket. Uncomment them to enable passthrough.

[container]
# base_image = "docker.io/astral/uv:python3.14-trixie"
# fuse_device = true  # pass /dev/fuse through for nested rootless containers

# mounts = [
#   {source = "$HOME/.gitconfig", target = "/home/cauldron/.gitconfig", options = "ro,Z"},
#   {source = "$SSH_AUTH_SOCK", target = "$SSH_AUTH_SOCK", options = "ro"},
# ]

# ports = [
#   "8080:8080",
# ]

# known_hosts = [
#   "my-service.local:127.0.0.1",
# ]

[env]
